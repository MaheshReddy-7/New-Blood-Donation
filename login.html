<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body{
            font-family: Arial;
            background-color: #f2f2f2;
        }
        .login-box{
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }
        input{
            width: 100%;
            padding: 8px;
            margin: 8px 0;
        }
        button{
            width: 100%;
            padding: 8px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover{
            background: darkblue;
        }
    </style>
</head>
<body>

//this is sample form
    
<div class="login-box">
    <h2 align="center">Login</h2>

    <form action="login.php" method="POST">
        <input type="text" name="username" placeholder="Enter Username" required>
        <input type="password" name="password" placeholder="Enter Password" required>
        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
